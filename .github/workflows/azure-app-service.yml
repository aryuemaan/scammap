# Deploys ScamMap to Azure App Service (Linux, Node 22) on every push to main.
#
# Set up once (README, "Deploy on Azure"):
#   GitHub repo > Settings > Secrets and variables > Actions
#     Variables tab:  AZURE_WEBAPP_NAME = the name of your Web App (for example scammap-pinaut)
#     Secrets tab:    AZURE_WEBAPP_PUBLISH_PROFILE = the whole publish profile file from the Azure portal
# Until AZURE_WEBAPP_NAME is set this workflow does nothing, so it never fails on forks or before Azure exists.
#
# The build runs here, not on Azure: typecheck, tests, server + app build, then only what the server needs at run
# time is uploaded (the same files as the Dockerfile's runtime stage). Server secrets live in the Web App's
# Environment variables, never in this file.
name: Deploy to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: azure-app-service
  cancel-in-progress: true

jobs:
  build-and-deploy:
    if: ${{ vars.AZURE_WEBAPP_NAME != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck and test
        run: npm run typecheck && npm test

      - name: Build server and app
        run: npm run build
        env:
          # Optional map settings baked into the app (set them as repository variables if you use them).
          VITE_MAPTILER_KEY: ${{ vars.VITE_MAPTILER_KEY }}
          VITE_TILE_URL: ${{ vars.VITE_TILE_URL }}

      - name: Keep only run-time files
        run: |
          npm prune --omit=dev
          mkdir -p release/src/db release/data
          cp -r dist node_modules package.json package-lock.json config release/
          cp -r src/db/migrations release/src/db/
          cp -r data/external release/data/
          du -sh release

      - name: Deploy to Azure
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: release

      - name: Check the deployed server
        run: |
          url="${{ steps.deploy.outputs.webapp-url }}/health"
          for i in $(seq 1 30); do
            if curl -fsS "$url"; then echo; echo "Live: $url"; exit 0; fi
            sleep 10
          done
          echo "The server did not answer $url within 5 minutes: open the Web App's Log stream in the Azure portal."
          exit 1

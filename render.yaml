# Render Blueprint: the website + API on Render (free), the data on Supabase (free Postgres).
services:
  - type: web
    name: scammap
    runtime: docker
    region: singapore
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false # Paste the Supabase Session pooler URI here
      - key: DB_SSL
        value: "true"
      - key: PEPPER
        sync: false # Paste your 64-character hex string here
      - key: LICENSE_ENFORCE
        value: "true"
      - key: TRUST_BODY_IP_PREFIX
        value: "true"
      - key: LICENSE_JSON
        sync: false # Paste the JSON block here
      - key: GEMINI_API_KEY
        sync: false
      - key: VITE_MAPTILER_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: URLHAUS_AUTH_KEY
        sync: false
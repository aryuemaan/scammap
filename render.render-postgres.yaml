# Render Blueprint with Render's own (free, 30-day) Postgres. To use it: New > Blueprint > pick this repo, and set
# "Blueprint Path" to render.render-postgres.yaml. The default render.yaml uses Supabase instead.
# Singapore is the closest Render region to India, which keeps lookups well under 500 ms.
services:
  - type: web
    name: scammap
    runtime: docker
    region: singapore
    # "free" needs no payment. It sleeps after 15 minutes without requests and takes about a minute to wake, so keep it
    # awake with a free uptime monitor on /health every 5 minutes (README, "Render"). For judging day you can switch the
    # service to "starter" (US$7/month, always on) in the Render dashboard: Settings > Instance Type.
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: scammap-db
          property: connectionString
      - key: PEPPER
        generateValue: true
      - key: LICENSE_ENFORCE
        value: "true"
      - key: TRUST_BODY_IP_PREFIX
        value: "true"
      - key: LICENSE_JSON
        sync: false

databases:
  - name: scammap-db
    region: singapore
    # Free Render Postgres expires 30 days after creation; fine for the event, upgrade for anything longer.
    plan: free
    databaseName: scammap
    # Empty allow list = reachable only from Render services, not the internet.
    ipAllowList: []
